global:
  smtp_smarthost: mailbox:1025
  smtp_from: monitoring@example.test
  smtp_require_tls: false
route:
  receiver: warehouse-operations
  group_by: [alertname]
  group_wait: 2s
  group_interval: 10s
  repeat_interval: 2h
receivers:
  - name: warehouse-operations
    email_configs:
      - to: operations@example.test
        send_resolved: true
